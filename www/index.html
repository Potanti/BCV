<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PotaDollar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>PotaDollar</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --txt:#f1f5f9; --mut:#94a3b8; --acc:#22c55e; --acc2:#60a5fa; --err:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         color:var(--txt); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); }
  .card { background:var(--card); width:100%; max-width:460px; border-radius:16px; padding:24px;
          box-shadow:0 10px 30px rgba(0,0,0,.35); }
  h1 { margin:0 0 2px; font-size:1.5rem; color:var(--txt); font-weight:700; }
  .sub { font-size:.85rem; color:var(--mut); margin-bottom:14px; }
  .by { margin-top:22px; padding-top:14px; border-top:1px solid #334155; text-align:center;
        font-size:.85rem; color:var(--mut); letter-spacing:.03em; }
  .rates { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .box { background:#0f172a; border-radius:12px; padding:14px; }
  .box .name { font-size:.8rem; color:var(--mut); }
  .rate { font-size:1.7rem; font-weight:700; margin:6px 0 2px; border-radius:8px; }
  #rateUSD { color:var(--acc); }
  #rateEUR { color:var(--acc2); }
  .date { font-size:.72rem; color:var(--mut); min-height:1em; }
  .meta { font-size:.85rem; color:var(--mut); min-height:1.2em; margin-top:12px; }
  .meta.error { color:var(--err); }
  hr { border:none; border-top:1px solid #334155; margin:20px 0; }
  label { display:block; font-size:.85rem; color:var(--mut); margin-bottom:6px; }
  input, select { width:100%; padding:12px; font-size:max(16px,1.1rem); border-radius:10px; border:1px solid #334155;
          background:#0f172a; color:var(--txt); }
  .row { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:end; }
  .swap { margin:0; width:48px; height:48px; padding:0; font-size:1.4rem; border-radius:50%; }
  input[readonly] { opacity:.85; border-style:dashed; }
  .dir { font-size:.8rem; color:var(--mut); margin-top:10px; text-align:center; min-height:1.2em; }
  .sel { margin-bottom:12px; }
  button { margin-top:16px; width:100%; padding:12px; border:0; border-radius:10px; cursor:pointer;
           background:var(--acc); color:#052e16; font-weight:700; font-size:1rem; }
  button:disabled { opacity:.6; cursor:wait; }
  .auto { font-size:.8rem; color:var(--mut); margin-top:10px; text-align:center; }
  .hist h2 { margin:0 0 12px; font-size:1rem; color:var(--mut); font-weight:600; }
  .filters { display:grid; grid-template-columns:1fr 1.4fr 1fr; gap:8px; }
  .filters select { padding:10px 8px; font-size:max(16px,1rem); }
  .note { font-size:.8rem; color:var(--mut); margin-top:12px; min-height:1.2em; }
  .tablewrap { margin-top:10px; max-height:340px; overflow:auto; border-radius:10px; background:#0f172a; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { padding:9px 10px; text-align:right; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { position:sticky; top:0; background:#0f172a; color:var(--mut); font-weight:600; font-size:.8rem; }
  tbody tr { border-top:1px solid #1e293b; }
  td.usd { color:var(--acc); }
  td.eur { color:var(--acc2); }
  .flash { animation:flash 2s ease-out; }
  @keyframes flash { 0% { background:#16a34a; color:#fff; } 100% { background:transparent; } }
</style>
</head>
<body>
<main class="card">
  <h1>PotaDollar</h1>
  <div class="sub">Tasa oficial BCV · Venezuela</div>

  <div class="rates">
    <div class="box">
      <div class="name">Dólar (USD)</div>
      <div class="rate" id="rateUSD">—</div>
      <div class="date" id="dateUSD"></div>
    </div>
    <div class="box">
      <div class="name">Euro (EUR)</div>
      <div class="rate" id="rateEUR">—</div>
      <div class="date" id="dateEUR"></div>
    </div>
  </div>
  <div class="meta" id="meta">Cargando…</div>

  <hr>

  <div class="sel">
    <label for="moneda">Convertir con</label>
    <select id="moneda">
      <option value="USD">Dólar (USD)</option>
      <option value="EUR">Euro (EUR)</option>
    </select>
  </div>
  <div class="row">
    <div id="boxExt">
      <label for="ext" id="extLabel">Dólares (USD)</label>
      <input id="ext" type="number" inputmode="decimal" min="0" step="any" placeholder="0.00">
    </div>
    <button id="swap" class="swap" type="button" aria-label="Invertir conversión" title="Invertir conversión">⇄</button>
    <div id="boxVes">
      <label for="ves" id="vesLabel">Bolívares (Bs.)</label>
      <input id="ves" type="number" inputmode="decimal" min="0" step="any" placeholder="0.00">
    </div>
  </div>
  <div class="dir" id="dir"></div>

  <button id="refresh">Actualizar tasas</button>
  <div class="auto" id="auto">Revisión automática cada 5 minutos</div>

  <hr>

  <section class="hist">
    <h2>Historial de tasas BCV</h2>
    <div class="filters">
      <div><label for="hAnio">Año</label><select id="hAnio"></select></div>
      <div><label for="hMes">Mes</label><select id="hMes"></select></div>
      <div><label for="hDia">Día</label><select id="hDia"></select></div>
    </div>
    <div class="note" id="hNota">Cargando historial…</div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Fecha</th><th>USD</th><th>EUR</th></tr></thead>
        <tbody id="hBody"></tbody>
      </table>
    </div>
  </section>

  <footer class="by">By Pota.co</footer>
</main>

<script>
const BASE = "https://ve.dolarapi.com/v1";
const CACHE_KEY = "tasa_bcv_cache_v2";
const INTERVALO_MS = 5 * 60 * 1000; // revisa cada 5 minutos

const MONEDAS = {
  USD: { nombre: "Dólares (USD)", rutas: ["/dolares"] },
  // Si /euros no existiera, se intenta con el listado general de cotizaciones
  EUR: { nombre: "Euros (EUR)", rutas: ["/euros", "/cotizaciones"] },
};

const $ = (id) => document.getElementById(id);
const $meta = $("meta"), $ext = $("ext"), $ves = $("ves"), $btn = $("refresh");
const $moneda = $("moneda"), $auto = $("auto");

const tasas = { USD: null, EUR: null };   // valor actual
const previos = { USD: null, EUR: null }; // {fecha, valor} de la revisión anterior

const fmt = (n) => new Intl.NumberFormat("es-VE", { minimumFractionDigits: 2, maximumFractionDigits: 4 }).format(n);

function extraerOficial(data, codigo) {
  if (!Array.isArray(data)) return null;
  const lista = data.filter((d) => !d.moneda || d.moneda === codigo);
  const item = lista.find((d) => d.fuente === "oficial") || null;
  if (!item) return null;
  const valor = item.promedio ?? item.venta ?? item.compra;
  if (typeof valor !== "number") return null;
  return { valor, fecha: item.fechaActualizacion };
}

async function obtener(codigo) {
  let ultimoError = new Error("Sin datos");
  for (const ruta of MONEDAS[codigo].rutas) {
    try {
      const res = await fetch(BASE + ruta, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const r = extraerOficial(await res.json(), codigo);
      if (r) return r;
      throw new Error("No se encontró la tasa oficial");
    } catch (e) { ultimoError = e; }
  }
  throw ultimoError;
}

function pintar(codigo, { valor, fecha }, desdeCache) {
  tasas[codigo] = valor;
  $("rate" + codigo).textContent = "Bs. " + fmt(valor);
  const f = fecha ? new Date(fecha).toLocaleString("es-VE") : "";
  $("date" + codigo).textContent = (desdeCache ? "guardado · " : "") + f;
}

function flash(codigo, valor) {
  const el = $("rate" + codigo);
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  try {
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification("Tasa BCV actualizada", { body: codigo + ": Bs. " + fmt(valor) });
    }
  } catch {}
}

function tasaActiva() { return tasas[$moneda.value]; }
function actualizarEtiqueta() { $("extLabel").textContent = MONEDAS[$moneda.value].nombre; aplicarSentido(); }

// Sentido de la conversión: "ext" = de divisa a bolívares, "ves" = de bolívares a divisa.
// El campo de arriba/izquierda es el que escribes; el otro muestra el resultado.
let sentido = "ext";
function recalcular() { if (sentido === "ext") desdeExt(); else desdeVes(); }
function aplicarSentido() {
  const ext = sentido === "ext";
  $("boxExt").style.order = ext ? 0 : 2;
  $("boxVes").style.order = ext ? 2 : 0;
  $("swap").style.order = 1;
  $ext.readOnly = !ext;
  $ves.readOnly = ext;
  const n = MONEDAS[$moneda.value].nombre;
  $("dir").textContent = ext ? "Convirtiendo de " + n + " a Bolívares" : "Convirtiendo de Bolívares a " + n;
}

function desdeExt() {
  const t = tasaActiva();
  if (t) $ves.value = $ext.value === "" ? "" : (parseFloat($ext.value) * t).toFixed(2);
}
function desdeVes() {
  const t = tasaActiva();
  if (t) $ext.value = $ves.value === "" ? "" : (parseFloat($ves.value) / t).toFixed(2);
}

async function cargar(silencioso = false) {
  $btn.disabled = true;
  if (!silencioso) { $meta.className = "meta"; $meta.textContent = "Consultando…"; }

  const codigos = Object.keys(MONEDAS);
  const resultados = await Promise.allSettled(codigos.map(obtener));
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem(CACHE_KEY)) || {}; } catch {}
  const errores = [];

  resultados.forEach((r, i) => {
    const c = codigos[i];
    if (r.status === "fulfilled") {
      const prev = previos[c];
      const cambio = prev && (prev.fecha !== r.value.fecha || prev.valor !== r.value.valor);
      pintar(c, r.value, false);
      if (cambio) flash(c, r.value.valor);
      previos[c] = r.value;
      cache[c] = r.value;
    } else if (cache[c]) {
      pintar(c, cache[c], true);
      errores.push(c + " (sin conexión, valor guardado)");
    } else {
      $("rate" + c).textContent = "—";
      $("date" + c).textContent = "";
      errores.push(c + ": " + r.reason.message);
    }
  });

  try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch {}

  if (errores.length) {
    $meta.className = "meta error";
    $meta.textContent = "Aviso: " + errores.join(" · ");
  } else {
    $meta.className = "meta";
    $meta.textContent = "Tasas actualizadas correctamente";
  }
  $auto.textContent = "Última revisión: " + new Date().toLocaleTimeString("es-VE") + " · se revisa cada 5 minutos";
  recalcular();
  $btn.disabled = false;
}

$ext.addEventListener("input", desdeExt);
$ves.addEventListener("input", desdeVes);
$moneda.addEventListener("change", () => { actualizarEtiqueta(); recalcular(); });
$("swap").addEventListener("click", () => {
  sentido = sentido === "ext" ? "ves" : "ext";
  aplicarSentido();
  recalcular();
});
$btn.addEventListener("click", () => cargar(false));

// ---------- Historial de tasas (USD y EUR) ----------
const HIST_KEY = "tasa_bcv_hist_v1";
const HIST_URL = { USD: BASE + "/historicos/dolares/oficial", EUR: BASE + "/historicos/euros/oficial" };
const HIST_DIA = { USD: BASE + "/historicos/dolares/oficial/", EUR: BASE + "/historicos/euros/oficial/" };
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const $hAnio = $("hAnio"), $hMes = $("hMes"), $hDia = $("hDia"), $hBody = $("hBody"), $hNota = $("hNota");
let hist = {}; // "YYYY-MM-DD" -> { USD, EUR }

function normFecha(s) {
  const m = String(s).match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  return m ? m[1] + "-" + m[2].padStart(2, "0") + "-" + m[3].padStart(2, "0") : null;
}

function agregarHist(codigo, datos) {
  (Array.isArray(datos) ? datos : [datos]).forEach((d) => {
    if (!d || typeof d !== "object") return;
    const f = normFecha(d.fecha);
    const v = d.promedio ?? d.venta ?? d.compra;
    if (f && typeof v === "number") (hist[f] = hist[f] || {})[codigo] = v;
  });
}

async function cargarHistorial() {
  const codigos = Object.keys(HIST_URL);
  const res = await Promise.allSettled(codigos.map((c) =>
    fetch(HIST_URL[c], { cache: "no-store" }).then((r) => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
  ));
  const previo = hist;
  hist = {};
  let ok = 0;
  res.forEach((r, i) => { if (r.status === "fulfilled") { agregarHist(codigos[i], r.value); ok++; } });
  if (ok === 0) {
    hist = previo;
    if (!Object.keys(hist).length) { try { hist = JSON.parse(localStorage.getItem(HIST_KEY)) || {}; } catch {} }
  } else {
    try { localStorage.setItem(HIST_KEY, JSON.stringify(hist)); } catch {}
  }
  armarFiltros();
  await actualizarHist();
}

function armarFiltros() {
  const actual = String(new Date().getFullYear());
  const anios = [...new Set(Object.keys(hist).map((f) => f.slice(0, 4)))].sort().reverse();
  if (!anios.length) anios.push(actual);
  const elegido = $hAnio.value || (anios.includes(actual) ? actual : anios[0]);
  $hAnio.innerHTML = anios.map((a) => `<option value="${a}">${a}</option>`).join("");
  $hAnio.value = anios.includes(elegido) ? elegido : anios[0];
  if (!$hMes.options.length) {
    $hMes.innerHTML = '<option value="">Todo el año</option>' +
      MESES.map((n, i) => `<option value="${String(i + 1).padStart(2, "0")}">${n}</option>`).join("");
  }
  if (!$hDia.options.length) {
    let o = '<option value="">Todos</option>';
    for (let i = 1; i <= 31; i++) o += `<option value="${String(i).padStart(2, "0")}">${i}</option>`;
    $hDia.innerHTML = o;
  }
}

// Si el día elegido no está en la lista, se consulta directamente esa fecha
async function consultarDia(ruta) {
  await Promise.allSettled(Object.keys(HIST_DIA).map(async (c) => {
    const r = await fetch(HIST_DIA[c] + ruta, { cache: "no-store" });
    if (r.ok) agregarHist(c, await r.json());
  }));
}

async function actualizarHist() {
  const a = $hAnio.value, m = $hMes.value, d = $hDia.value;
  if (m && d && !hist[`${a}-${m}-${d}`]) await consultarDia(`${a}/${m}/${d}`);
  renderHist();
}

function renderHist() {
  const a = $hAnio.value, m = $hMes.value, d = $hDia.value;
  const fdmy = (f) => f.split("-").reverse().join("/");
  let fechas = Object.keys(hist).filter((f) => {
    const [fa, fm, fd] = f.split("-");
    return fa === a && (!m || fm === m) && (!d || fd === d);
  }).sort().reverse();
  let nota;

  if (!Object.keys(hist).length) {
    nota = "No se pudo cargar el historial. Revisa tu conexión.";
  } else if (fechas.length) {
    const donde = m ? MESES[parseInt(m, 10) - 1] + " " + a : "todo el año " + a;
    nota = fechas.length + (fechas.length === 1 ? " día" : " días") + " · " + donde;
  } else if (m && d) {
    const objetivo = `${a}-${m}-${d}`;
    const previa = Object.keys(hist).filter((f) => f < objetivo).sort().pop();
    if (previa) {
      fechas = [previa];
      nota = "No hay tasa publicada el " + fdmy(objetivo) + " (fin de semana, feriado o sin datos). Se muestra la última vigente.";
    } else {
      nota = "Sin datos para esa fecha.";
    }
  } else {
    nota = "Sin datos para esa selección.";
  }

  const celda = (v) => (v == null ? "—" : fmt(v));
  $hBody.innerHTML = fechas.map((f) =>
    `<tr><td>${fdmy(f)}</td><td class="usd">${celda(hist[f].USD)}</td><td class="eur">${celda(hist[f].EUR)}</td></tr>`
  ).join("");
  $hNota.textContent = nota;
}

[$hAnio, $hMes, $hDia].forEach((el) => el.addEventListener("change", actualizarHist));

actualizarEtiqueta();
cargar(false);
setInterval(() => cargar(true), INTERVALO_MS);
armarFiltros();
cargarHistorial();
setInterval(cargarHistorial, INTERVALO_MS * 6); // el historial se refresca cada 30 minutos
document.addEventListener("visibilitychange", () => { if (!document.hidden) cargar(true); });

if ("Notification" in window && Notification.permission === "default") {
  document.addEventListener("click", () => Notification.requestPermission(), { once: true });
}

// Service worker: permite instalar la app y abrirla sin conexión
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
