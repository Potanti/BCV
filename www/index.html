<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tasa BCV">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Tasa BCV</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --txt:#f1f5f9; --mut:#94a3b8; --acc:#22c55e; --acc2:#60a5fa; --err:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         color:var(--txt); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); }
  .card { background:var(--card); width:100%; max-width:460px; border-radius:16px; padding:24px;
          box-shadow:0 10px 30px rgba(0,0,0,.35); }
  h1 { margin:0 0 14px; font-size:1.1rem; color:var(--mut); font-weight:600; }
  .rates { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .box { background:#0f172a; border-radius:12px; padding:14px; }
  .box .name { font-size:.8rem; color:var(--mut); }
  .rate { font-size:1.7rem; font-weight:700; margin:6px 0 2px; border-radius:8px; }
  #rateUSD { color:var(--acc); }
  #rateEUR { color:var(--acc2); }
  .date { font-size:.72rem; color:var(--mut); min-height:1em; }
  .meta { font-size:.85rem; color:var(--mut); min-height:1.2em; margin-top:12px; }
  .meta.error { color:var(--err); }
  hr { border:none; border-top:1px solid #334155; margin:20px 0; }
  label { display:block; font-size:.85rem; color:var(--mut); margin-bottom:6px; }
  input, select { width:100%; padding:12px; font-size:max(16px,1.1rem); border-radius:10px; border:1px solid #334155;
          background:#0f172a; color:var(--txt); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .sel { margin-bottom:12px; }
  button { margin-top:16px; width:100%; padding:12px; border:0; border-radius:10px; cursor:pointer;
           background:var(--acc); color:#052e16; font-weight:700; font-size:1rem; }
  button:disabled { opacity:.6; cursor:wait; }
  .auto { font-size:.8rem; color:var(--mut); margin-top:10px; text-align:center; }
  .flash { animation:flash 2s ease-out; }
  @keyframes flash { 0% { background:#16a34a; color:#fff; } 100% { background:transparent; } }
</style>
</head>
<body>
<main class="card">
  <h1>Tasa oficial BCV · Venezuela</h1>

  <div class="rates">
    <div class="box">
      <div class="name">Dólar (USD)</div>
      <div class="rate" id="rateUSD">—</div>
      <div class="date" id="dateUSD"></div>
    </div>
    <div class="box">
      <div class="name">Euro (EUR)</div>
      <div class="rate" id="rateEUR">—</div>
      <div class="date" id="dateEUR"></div>
    </div>
  </div>
  <div class="meta" id="meta">Cargando…</div>

  <hr>

  <div class="sel">
    <label for="moneda">Convertir con</label>
    <select id="moneda">
      <option value="USD">Dólar (USD)</option>
      <option value="EUR">Euro (EUR)</option>
    </select>
  </div>
  <div class="row">
    <div>
      <label for="ext" id="extLabel">Dólares (USD)</label>
      <input id="ext" type="number" inputmode="decimal" min="0" step="any" placeholder="0.00">
    </div>
    <div>
      <label for="ves">Bolívares (Bs.)</label>
      <input id="ves" type="number" inputmode="decimal" min="0" step="any" placeholder="0.00">
    </div>
  </div>

  <button id="refresh">Actualizar tasas</button>
  <div class="auto" id="auto">Revisión automática cada 5 minutos</div>
</main>

<script>
const BASE = "https://ve.dolarapi.com/v1";
const CACHE_KEY = "tasa_bcv_cache_v2";
const INTERVALO_MS = 5 * 60 * 1000; // revisa cada 5 minutos

const MONEDAS = {
  USD: { nombre: "Dólares (USD)", rutas: ["/dolares"] },
  // Si /euros no existiera, se intenta con el listado general de cotizaciones
  EUR: { nombre: "Euros (EUR)", rutas: ["/euros", "/cotizaciones"] },
};

const $ = (id) => document.getElementById(id);
const $meta = $("meta"), $ext = $("ext"), $ves = $("ves"), $btn = $("refresh");
const $moneda = $("moneda"), $auto = $("auto");

const tasas = { USD: null, EUR: null };   // valor actual
const previos = { USD: null, EUR: null }; // {fecha, valor} de la revisión anterior

const fmt = (n) => new Intl.NumberFormat("es-VE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);

function extraerOficial(data, codigo) {
  if (!Array.isArray(data)) return null;
  const lista = data.filter((d) => !d.moneda || d.moneda === codigo);
  const item = lista.find((d) => d.fuente === "oficial") || null;
  if (!item) return null;
  const valor = item.promedio ?? item.venta ?? item.compra;
  if (typeof valor !== "number") return null;
  return { valor, fecha: item.fechaActualizacion };
}

async function obtener(codigo) {
  let ultimoError = new Error("Sin datos");
  for (const ruta of MONEDAS[codigo].rutas) {
    try {
      const res = await fetch(BASE + ruta, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const r = extraerOficial(await res.json(), codigo);
      if (r) return r;
      throw new Error("No se encontró la tasa oficial");
    } catch (e) { ultimoError = e; }
  }
  throw ultimoError;
}

function pintar(codigo, { valor, fecha }, desdeCache) {
  tasas[codigo] = valor;
  $("rate" + codigo).textContent = "Bs. " + fmt(valor);
  const f = fecha ? new Date(fecha).toLocaleString("es-VE") : "";
  $("date" + codigo).textContent = (desdeCache ? "guardado · " : "") + f;
}

function flash(codigo, valor) {
  const el = $("rate" + codigo);
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  try {
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification("Tasa BCV actualizada", { body: codigo + ": Bs. " + fmt(valor) });
    }
  } catch {}
}

function tasaActiva() { return tasas[$moneda.value]; }
function actualizarEtiqueta() { $("extLabel").textContent = MONEDAS[$moneda.value].nombre; }

function desdeExt() {
  const t = tasaActiva();
  if (t) $ves.value = $ext.value === "" ? "" : (parseFloat($ext.value) * t).toFixed(2);
}
function desdeVes() {
  const t = tasaActiva();
  if (t) $ext.value = $ves.value === "" ? "" : (parseFloat($ves.value) / t).toFixed(2);
}

async function cargar(silencioso = false) {
  $btn.disabled = true;
  if (!silencioso) { $meta.className = "meta"; $meta.textContent = "Consultando…"; }

  const codigos = Object.keys(MONEDAS);
  const resultados = await Promise.allSettled(codigos.map(obtener));
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem(CACHE_KEY)) || {}; } catch {}
  const errores = [];

  resultados.forEach((r, i) => {
    const c = codigos[i];
    if (r.status === "fulfilled") {
      const prev = previos[c];
      const cambio = prev && (prev.fecha !== r.value.fecha || prev.valor !== r.value.valor);
      pintar(c, r.value, false);
      if (cambio) flash(c, r.value.valor);
      previos[c] = r.value;
      cache[c] = r.value;
    } else if (cache[c]) {
      pintar(c, cache[c], true);
      errores.push(c + " (sin conexión, valor guardado)");
    } else {
      $("rate" + c).textContent = "—";
      $("date" + c).textContent = "";
      errores.push(c + ": " + r.reason.message);
    }
  });

  try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch {}

  if (errores.length) {
    $meta.className = "meta error";
    $meta.textContent = "Aviso: " + errores.join(" · ");
  } else {
    $meta.className = "meta";
    $meta.textContent = "Tasas actualizadas correctamente";
  }
  $auto.textContent = "Última revisión: " + new Date().toLocaleTimeString("es-VE") + " · se revisa cada 5 minutos";
  desdeExt();
  $btn.disabled = false;
}

$ext.addEventListener("input", desdeExt);
$ves.addEventListener("input", desdeVes);
$moneda.addEventListener("change", () => { actualizarEtiqueta(); desdeExt(); });
$btn.addEventListener("click", () => cargar(false));

actualizarEtiqueta();
cargar(false);
setInterval(() => cargar(true), INTERVALO_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) cargar(true); });

if ("Notification" in window && Notification.permission === "default") {
  document.addEventListener("click", () => Notification.requestPermission(), { once: true });
}

// Service worker: permite instalar la app y abrirla sin conexión
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
